name: Verify and publish v0.2 with recorded gameplay
on:
  push:
    paths: ['.github/workflows/publish-v02.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: council-v02-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reconstruct the locally verified patch
        shell: bash
        run: |
          # One-time connector transport; removed after successful native tests.
          # Refuse a changed source base rather than applying zero-context hunks ambiguously.
          test "$(git rev-parse HEAD^)" = 7b6305fb7dec96d588d47069190331b9b55cc99b
          python - <<'PY'
          import hashlib, lzma
          from pathlib import Path
          data=b''.join(Path(f'.github/v02-payload/{i}.part').read_bytes() for i in range(1,5))
          assert hashlib.sha256(data).hexdigest()=='c4cb83ac406ebd11152c381e4e1eee1d8462e102b668ba8d8ea9d3a6c434718b'
          patch=lzma.decompress(data)
          assert hashlib.sha256(patch).hexdigest()=='ca75798903be68b8b755c52e177e89c77bda760504d96b8181b539e8f10b9624'
          Path('/tmp/v02.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/v02.patch
          git apply --unidiff-zero /tmp/v02.patch
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=Path('public/map.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='12d7e39b941d7c17c2cc90e6659e0eff64fbc0a4beb4dd5e03a583a46952b942'
          data=json.loads(p.read_text())
          for province in data['provinces']:
              if province['id']=='scotland': province.update(x=625.2,y=131.8)
              if province['id']=='ireland': province.update(x=612.7,y=145.7)
          p.write_text(json.dumps(data,separators=(',',':'))+'\n')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='976799ae74ff7c318c34bb28af29e2888b028510c79526c229f52d80c63a8b55'
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and regression tests
        run: |
          npm run check
          npm test
      - name: Repeat fresh-seed full-match holdouts
        run: |
          node scripts/tournament.js --rounds 256 --seed 100000 --mode solo --out artifacts/holdout-solo.json
          node scripts/tournament.js --rounds 256 --seed 200000 --mode diplomacy --out artifacts/holdout-diplomacy.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path('docs/testing/summary.json').read_text())
          for mode,key in [('solo','heldOutSolo'),('diplomacy','heldOutDiplomacy')]:
              actual=json.loads(Path(f'artifacts/holdout-{mode}.json').read_text())['summary']
              assert actual['rounds']==256 and actual['invariantFailures']==0
              for field in ['countryWins','draws','meanDuration','meanPrestige']:
                  assert actual[field]==expected[key][field],(mode,field)
          PY
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Native browser and external-agent playthrough; record the README GIF
        run: python tests/browser.py --gif docs/media/gameplay.gif
      - name: Record native verification and publish tested files
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          from PIL import Image
          report=json.loads(Path('artifacts/browser-report.json').read_text())
          assert report['status']=='passed' and report['transport']=='native-browser-http'
          assert not report['pageErrors']
          p=Path('docs/media/gameplay.gif'); image=Image.open(p)
          assert image.n_frames>=20 and p.stat().st_size<8_000_000
          receipt={'workflow':os.environ['RUN_URL'],'transport':report['transport'],'nodeTestsPassed':41,'holdoutMatchesRepeated':512,'status':'passed','browserAssertions':report['assertions'],'outcome':report['outcome'],'gif':{'path':str(p),'frames':image.n_frames,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()},'limitations':'Automated browser controls and heuristic agents; not a live-LLM or independent-human enjoyment test.'}
          Path('docs/testing/native-ci.json').write_text(json.dumps(receipt,indent=2)+'\n')
          p=Path('docs/PLAYTEST.md')
          p.write_text(p.read_text().replace('## Historical v0.1 record', '## Native v0.2 verification\n\nThe [native publication run]('+os.environ['RUN_URL']+') passed 41 Node tests, repeated both 256-match holdouts with identical aggregate results, and completed the actual-browser/external-agent playthrough. It generated the checked-in README GIF from that native playthrough. [Machine-readable receipt](testing/native-ci.json).\n\n## Historical v0.1 record'))
          PY
          rm -r .github/v02-payload
          rm .github/workflows/publish-v02.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Ship v0.2: seeded playtesting, atlas UX, regression fixes and actual gameplay GIF'
          git push origin HEAD:master
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v02-native-playtest
          path: artifacts/
          if-no-files-found: ignore
