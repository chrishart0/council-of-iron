name: Author initial map
on:
  push:
    paths: ['.github/workflows/author-map.yml']
permissions:
  contents: write
jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install geopandas==1.1.2 shapely==2.1.2 pyogrio==0.12.1
      - name: Fetch public-domain coastline fixture
        run: |
          mkdir -p /tmp/coastline public
          for ext in shp shx dbf prj cpg; do
            curl --fail --retry 3 -L "https://raw.githubusercontent.com/geopandas/pyogrio/v0.11.1/pyogrio/tests/fixtures/naturalearth_lowres/naturalearth_lowres.$ext" -o "/tmp/coastline/naturalearth_lowres.$ext"
          done
      - name: Generate and verify the locally tested map
        run: |
          python scripts/build_map.py /tmp/coastline/naturalearth_lowres.shp
          echo '12d7e39b941d7c17c2cc90e6659e0eff64fbc0a4beb4dd5e03a583a46952b942  public/map.json' | sha256sum --check
      - name: Commit generated asset and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/map.json
          git rm .github/workflows/author-map.yml
          git commit -m 'Add verified 64-province map [skip ci]'
          git push origin HEAD:master
