name: Current rules integration source
on:
  push:
    branches: [traditional-bots-v06-workbench]
    paths: [.github/workflows/bots-workbench.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 054b56536a78448d2688d89425d66690b86f447c
          persist-credentials: false
      - run: git archive --format=tar HEAD > /tmp/council-current-rules.tar
      - uses: actions/upload-artifact@v4
        with:
          name: council-current-rules
          path: /tmp/council-current-rules.tar
          retention-days: 3
