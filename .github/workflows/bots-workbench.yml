name: Verify and publish traditional commanders
on:
  push:
    branches: [traditional-bots-v06-workbench]
    paths: [.github/workflows/bots-workbench.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: council-v06-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct the tested patch against its pinned source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, lzma
          data=b''.join(Path(f'.github/v06-payload/{i:02}.part').read_bytes() for i in range(1,6))
          assert hashlib.sha256(data).hexdigest()=='9b4c8aa004577da9502071762fbd5f4f11f552c59610410a57f35eebed72ab13'
          patch=lzma.decompress(data)
          assert hashlib.sha256(patch).hexdigest()=='a38aa6d7936d9d2051f90c0abb34bf35cbefb68f1668a47a68ae249c06544997'
          Path('/tmp/v06.patch').write_bytes(patch)
          PY
          git checkout --detach cd46a424c7ad4cb5e609c952f46b32651632404a
          git apply --unidiff-zero --check /tmp/v06.patch
          git apply --unidiff-zero /tmp/v06.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tactical, privacy, restart, retry and existing regression tests
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run check
          npm test | tee artifacts/node-tests.log
          grep -q '# pass 123' artifacts/node-tests.log
          grep -q '# fail 0' artifacts/node-tests.log
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for path,digest in json.loads(Path('docs/testing/v06-local.json').read_text())['unchangedFiles'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          PY
      - name: Reproduce 224 held-out matches with exact event fingerprints
        run: |
          node scripts/bot-tournament.js --rounds 96 --seed 36000 --mode mixed --out artifacts/holdout-mixed.json
          node scripts/bot-tournament.js --rounds 64 --seed 46000 --mode difficulty --out artifacts/holdout-difficulty.json
          node scripts/bot-tournament.js --rounds 64 --seed 56000 --mode selfplay --diplomacy --out artifacts/holdout-selfplay.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected=json.loads(Path('docs/testing/v06-local.json').read_text())
          for mode in ['mixed','difficulty','selfplay']:
              key=f'holdout-{mode}'
              actual=json.loads(Path(f'artifacts/{key}.json').read_text())
              for field in ['rounds','seedStart','seedEnd','mode','difficulty','diplomacy','mapSha256','draws','meanDuration','byPolicy','countryWins','rejectedNew','rejectedLegacy','invariantsFailed','meanMessages','meanAlliances','meanDepartures','maxMemoryBytes']:
                  assert actual['summary'][field]==expected['reports'][key][field],(mode,field)
              events=json.dumps([r['eventDigest'] for r in actual['results']],separators=(',',':')).encode()
              assert hashlib.sha256(events).hexdigest()==expected['eventDigestAggregates'][key],key
          PY
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Native browser gameplay, spectating, review, HUD and bot setup/DM checks
        run: python tests/browser.py
      - name: Record verification and preserve the tested candidate
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          paths={'gameplay':'artifacts/browser-report.json','review':'artifacts/review/review-browser-report.json','interface':'artifacts/ui/ui-browser-report.json','bots':'artifacts/bots/bots-browser-report.json'}
          reports={name:json.loads(Path(path).read_text()) for name,path in paths.items()}
          for name,report in reports.items():
              assert report['status']=='passed' and report['transport']=='native-browser-http',name
              assert not report['pageErrors'],name
          local=json.loads(Path('docs/testing/v06-local.json').read_text())
          source=Path('artifacts/bots/01-bot-lobby.png')
          shutil.copyfile(source,'docs/media/bot-setup.png')
          heldout={mode:json.loads(Path(f'artifacts/holdout-{mode}.json').read_text())['summary'] for mode in ['mixed','difficulty','selfplay']}
          receipt={'date':'2026-09-27','workflow':os.environ['RUN_URL'],'baseCommit':local['baseCommit'],'controllerVersion':local['controllerVersion'],'status':'passed','transport':'native-browser-http','nodeTestsPassed':123,'recordedLocalSimulationMatches':312,'holdoutMatchesRepeated':224,'unchangedFiles':local['unchangedFiles'],'eventDigestAggregates':{k:v for k,v in local['eventDigestAggregates'].items() if k.startswith('holdout-')},'holdouts':heldout,'browser':reports,'screenshot':{'path':'docs/media/bot-setup.png','sha256':hashlib.sha256(source.read_bytes()).hexdigest()},'limitations':'Traditional heuristic controllers and automated browser interactions, not independent human enjoyment testing. Repeating the same 224 games verifies determinism; it does not add independent balance samples. Difficulty has no resource or hidden-information advantage.'}
          Path('docs/testing/v06-native-ci.json').write_text(json.dumps(receipt,indent=2)+'\n')
          p=Path('docs/PLAYTEST.md')
          note='## Native v0.6 verification\n\nThe [native publication run]('+os.environ['RUN_URL']+') passed all 123 Node tests, verified unchanged gameplay/map/replay hashes, and reproduced all 224 held-out games with identical per-match event fingerprints and aggregate outcomes. All four native-browser suites passed: full gameplay/external-agent/spectating, after-action history, command-table interactions, and individual bot setup/DM commands/mobile layouts. No page errors were captured. [Machine-readable receipt](testing/v06-native-ci.json).\n\n'
          p.write_text(p.read_text().replace('## Earlier verification records',note+'## Earlier verification records',1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^.github/'; then echo 'Refusing to publish transport or workflow files'; exit 1; fi
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Ship v0.6: traditional commanders with tactics, diplomacy and fair difficulty'
          git archive --format=tar HEAD > /tmp/council-v06-tested.tar
          git rev-parse HEAD | tee artifacts/tested-commit.txt
          git push origin HEAD:refs/heads/traditional-bots-v06-verified-${GITHUB_RUN_ID}
      - name: Fast-forward master only when the tested base is still current
        run: |
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = cd46a424c7ad4cb5e609c952f46b32651632404a
          git push origin HEAD:master
          git push origin --delete traditional-bots-v06-verified-${GITHUB_RUN_ID}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v06-native-playtest
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v06-tested-source
          path: /tmp/council-v06-tested.tar
          if-no-files-found: ignore
          retention-days: 14
