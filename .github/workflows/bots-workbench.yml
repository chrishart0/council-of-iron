name: Verify and publish commanders for current war rules
on:
  push:
    branches: [traditional-bots-v06-workbench]
    paths: [.github/workflows/bots-workbench.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: council-v06-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct the current-rule candidate without replacing concurrent work
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, lzma
          data=b''.join(Path(f'.github/v06-current/{i:02}.part').read_bytes() for i in range(1,5))
          assert hashlib.sha256(data).hexdigest()=='04dd3e6bc7c8b36879954d7e4e77c38b9ad9e288edfb74c0c8a5fb7d7b9dece5'
          patch=lzma.decompress(data)
          assert hashlib.sha256(patch).hexdigest()=='1c621ac639c7f7b7c4f07c1e91ec2a8a9888b5e35a5754d837195c6ea0b95694'
          Path('/tmp/v06-current.patch').write_bytes(patch)
          PY
          git checkout --detach 054b56536a78448d2688d89425d66690b86f447c
          # Reuse only these bot files from the previously verified candidate.
          # The patch adapts them to current rules. No old engine, server or UI is restored.
          git restore --source=f1aba784a20a746808fccbefd6b8527b2df97c9d --worktree -- \
            agents/bot.js agents/bots/controller.js agents/bots/diplomacy.js \
            agents/bots/military.js agents/bots/position.js public/bot-profiles.js \
            scripts/bot-tournament.js scripts/check.js tests/bot-ai.test.js \
            tests/bot-server.test.js tests/bots-browser-server.js tests/bots-browser.py \
            docs/BOT-AI.md package.json package-lock.json
          git apply --unidiff-zero --check /tmp/v06-current.patch
          git apply --unidiff-zero /tmp/v06-current.patch
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tactical, odds, war, transit, privacy and regression tests
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run check
          npm test | tee artifacts/node-tests.log
          grep -q '# pass 141' artifacts/node-tests.log
          grep -q '# fail 0' artifacts/node-tests.log
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected=json.loads(Path('docs/testing/v06-local.json').read_text())
          for path,digest in expected['unchangedFiles'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          PY
      - name: Reproduce 112 held-out current-rule games with exact event fingerprints
        run: |
          node scripts/bot-tournament.js --rounds 48 --seed 90000 --mode mixed --out artifacts/holdout-mixed.json
          node scripts/bot-tournament.js --rounds 32 --seed 91000 --mode difficulty --out artifacts/holdout-difficulty.json
          node scripts/bot-tournament.js --rounds 32 --seed 92000 --mode selfplay --diplomacy --out artifacts/holdout-selfplay.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected=json.loads(Path('docs/testing/v06-local.json').read_text())
          fields=['rounds','seedStart','seedEnd','mode','difficulty','diplomacy','mapSha256','draws','meanDuration','byPolicy','countryWins','privateMotionConflicts','invalidNew','rejectedNew','rejectedLegacy','invariantsFailed','meanMessages','meanAlliances','meanDepartures','maxMemoryBytes']
          for mode in ['mixed','difficulty','selfplay']:
              key=f'holdout-{mode}'
              actual=json.loads(Path(f'artifacts/{key}.json').read_text())
              for field in fields:
                  assert actual['summary'][field]==expected['reports'][key][field],(mode,field)
              events=json.dumps([r['eventDigest'] for r in actual['results']],separators=(',',':')).encode()
              assert hashlib.sha256(events).hexdigest()==expected['eventDigestAggregates'][key],key
          PY
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Native gameplay, public spectating, after-action, command HUD and bot setup
        run: python tests/browser.py
      - name: Record verification and preserve the tested current-rule candidate
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          paths={'gameplay':'artifacts/browser-report.json','review':'artifacts/review/review-browser-report.json','interface':'artifacts/ui/ui-browser-report.json','bots':'artifacts/bots/bots-browser-report.json'}
          reports={name:json.loads(Path(path).read_text()) for name,path in paths.items()}
          for name,report in reports.items():
              assert report['status']=='passed' and report['transport']=='native-browser-http',name
              assert not report['pageErrors'],name
          local=json.loads(Path('docs/testing/v06-local.json').read_text())
          source=Path('artifacts/bots/01-bot-lobby.png')
          shutil.copyfile(source,'docs/media/bot-setup.png')
          heldout={mode:json.loads(Path(f'artifacts/holdout-{mode}.json').read_text())['summary'] for mode in ['mixed','difficulty','selfplay']}
          receipt={'date':local['date'],'workflow':os.environ['RUN_URL'],'baseCommit':local['baseCommit'],'controllerVersion':local['controllerVersion'],'status':'passed','transport':'native-browser-http','nodeTestsPassed':141,'recordedLocalSimulationMatches':176,'holdoutMatchesRepeated':112,'unchangedFiles':local['unchangedFiles'],'eventDigestAggregates':{k:v for k,v in local['eventDigestAggregates'].items() if k.startswith('holdout-')},'holdouts':heldout,'browser':reports,'screenshot':{'path':'docs/media/bot-setup.png','sha256':hashlib.sha256(source.read_bytes()).hexdigest()},'limitations':'Current dice-combat, war, transit and industry-score rules preserved. Traditional heuristic controllers and automated browser interactions, not independent human enjoyment testing. Repeating these 112 games verifies determinism, not additional independent samples. Hard had higher mean Prestige but lower first-place rate than Standard in this sample.'}
          Path('docs/testing/v06-native-ci.json').write_text(json.dumps(receipt,indent=2)+'\n')
          p=Path('docs/PLAYTEST.md')
          note='## Native v0.6 current-rule verification\n\nThe [native publication run]('+os.environ['RUN_URL']+') passed all 141 Node tests, verified unchanged current gameplay/map/replay hashes, and reproduced all 112 held-out current-rule games with identical per-match event fingerprints and aggregate results. All four native-browser suites passed: full gameplay/external-agent/spectating, after-action history, command-table interactions, and individual bot setup/ally DM commands/mobile layouts. No page errors were captured. [Machine-readable receipt](testing/v06-native-ci.json). The earlier original-rule results are retained separately and are not evidence for the current combat or scoring system.\n\n'
          p.write_text(p.read_text().replace('## Earlier verification records',note+'## Earlier verification records',1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^.github/'; then echo 'Refusing to publish transport or workflow files'; exit 1; fi
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Ship traditional commanders for dice combat, industrial scoring and coalition war'
          git archive --format=tar HEAD > /tmp/council-v06-current-tested.tar
          git rev-parse HEAD | tee artifacts/tested-commit.txt
          git push origin HEAD:refs/heads/traditional-bots-v06-current-verified-${GITHUB_RUN_ID}
      - name: Fast-forward master only when the tested base is still current
        run: |
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = 054b56536a78448d2688d89425d66690b86f447c
          git push origin HEAD:master
          git push origin --delete traditional-bots-v06-current-verified-${GITHUB_RUN_ID}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v06-current-native-playtest
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v06-current-tested-source
          path: /tmp/council-v06-current-tested.tar
          if-no-files-found: ignore
          retention-days: 14
