name: Spectator integration source
on:
  push:
    branches: [command-table-v05-workbench]
    paths: [.github/workflows/ui-workbench.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 125cf3ce070a6e9275d13353a6b401de8935ef6b
          persist-credentials: false
      - run: git archive --format=tar HEAD > /tmp/spectator-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: spectator-source
          path: /tmp/spectator-source.tar
          retention-days: 3
